server:
  port: 8083

spring:
  application:
    name: mall-order
  datasource:
    url: ${MALL_ORDER_DB_URL:jdbc:h2:mem:mall_order;DB_CLOSE_DELAY=-1}
    username: ${MALL_DB_USER:sa}
    password: ${MALL_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

mall:
  services:
    product: ${MALL_PRODUCT_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
